name: CI and release artifact

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Fetch pinned data sources
        run: npm run data:fetch
      - name: Build and atomically validate data pack
        run: npm run data:build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: hanzistep-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
